name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      should_release:
        description: Build, sign, and publish a draft release
        required: true
        type: boolean
        default: false
      signing_smoke_test:
        description: Build and sign Windows artifacts without creating a release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: Validate (${{ matrix.check.name }})
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: npm run lint
            runner: ubuntu-latest
          - name: Storybook
            command: npm run build-storybook
            runner: ubuntu-latest
          - name: Tests
            command: npm test
            runner: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules and native builds
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            .vite
            **/node_modules
            **/*.node
            **/build/Release
          key: ${{ runner.os }}-node-v2-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/binding.gyp', 'src/app/irsdk/native/**/*.c', 'src/app/irsdk/native/**/*.cc', 'src/app/irsdk/native/**/*.cpp', 'src/app/irsdk/native/**/*.h', 'src/app/irsdk/native/**/*.hpp') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Test Squirrel signing package updates
        if: matrix.check.name == 'Tests'
        shell: pwsh
        run: ./tools/signing/rebuild-squirrel.spec.ps1

      - name: Upload coverage report
        if: matrix.check.name == 'Tests'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage

  build:
    name: build
    needs: validation
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Confirm validation passed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            echo "Validation result: $VALIDATION_RESULT" >&2
            exit 1
          fi
