name: Build Windows app

# Builds a runnable, unsigned Windows build of the app on every push to main
# (or on demand) and attaches it to the run as a downloadable zip. No local
# toolchain needed: unzip and run irdashies.exe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build native iRacing addon
        run: npm run irsdk:build

      - name: Package Windows app
        run: npx electron-forge package

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: irdashies-windows
          path: out/irdashies-win32-x64
          if-no-files-found: error
          retention-days: 14
